<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Le monde du travail</title>
<style>
:root{--bg:#1f1147;--card:#2d1b69;--txt:#fff;--mut:#c9bff2;--r:#e21b3c;--b:#1368ce;--y:#d89e00;--g:#26890c;--ok:#26890c;--ko:#e21b3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,4vw,44px);margin:.3em 0;text-align:center}
.card{background:var(--card);border-radius:16px;padding:20px;margin:12px 0}
.center{text-align:center}
.mut{color:var(--mut)}
button{font:inherit;border:0;border-radius:12px;padding:14px 22px;font-weight:700;cursor:pointer;color:#fff;background:#6c4bd8}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:14px;border-radius:12px;border:0;width:100%;max-width:360px;font-size:20px;text-align:center}
.qr{background:#fff;padding:14px;border-radius:12px;display:inline-block}
.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.players span{background:#ffffff22;padding:6px 12px;border-radius:20px;font-weight:600}
.q{font-size:clamp(22px,4.5vw,46px);font-weight:800;text-align:center;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{min-height:90px;font-size:clamp(17px,2.6vw,28px);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px}
.c0{background:var(--r)}.c1{background:var(--b)}.c2{background:var(--y)}.c3{background:var(--g)}
.dim{opacity:.25}
.timer{font-size:56px;font-weight:900;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score li{display:flex;justify-content:space-between;background:#ffffff18;margin:6px 0;padding:10px 14px;border-radius:10px;font-size:20px}
ol.score{padding:0;list-style:none;max-width:560px;margin:0 auto}
.big{font-size:clamp(28px,6vw,60px);font-weight:900;text-align:center}
.hidden{display:none}
@media (max-width:600px){.grid{grid-template-columns:1fr}.ans{min-height:70px}}
</style>
</head>
<body>
<div class="wrap" id="app"><h1>Chargement…</h1></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const V=[["un employeur","雇主","gùzhǔ"],["un employé / salarié","员工","yuángōng"],["un collègue","同事","tóngshì"],["un cadre / responsable","管理岗位","guǎnlǐ gǎngwèi"],
["l'embauche / le recrutement","招聘","zhāopìn"],["faire carrière / évoluer","晋升","jìnshēng"],["une compétence","技能","jìnéng"],["la performance","绩效","jìxiào"],
["l'inégalité salariale","薪资差距","xīnzī chājù"],["le salaire / la rémunération","工资","gōngzī"],["le soutien de famille","家庭顶梁柱","jiātíng dǐngliángzhù"],["la répartition des tâches","家务分担","jiāwù fēndān"],
["la parité / l'égalité","平等","píngděng"],["la discrimination","歧视","qíshì"],["le stéréotype / le préjugé","刻板印象","kèbǎn yìnxiàng"],["le télétravail","远程办公","yuǎnchéng bàngōng"],
["la flexibilité","灵活性","línghuó xìng"],["l'équilibre vie pro / perso","生活平衡","shēnghuó pínghéng"],["les trajets quotidiens","通勤","tōngqín"],["l'isolement","孤独感","gūdú gǎn"],
["les outils numériques","数字工具","shùzì gōngjù"],["l'empreinte écologique","生态足迹","shēngtài zújì"]];
const TIME=20, PREFIX="pqm-travail-", PO=window.PEER_OPTS||{};
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const zh=v=>v[1]+" ("+v[2]+")";
function buildQuiz(){
  return shuffle(V.map((_,i)=>i)).map((i,n)=>{
    const others=shuffle(V.map((_,j)=>j).filter(j=>j!==i)).slice(0,3);
    const toFr=n%2===0;
    const q=toFr?`Que veut dire « ${zh(V[i])} » ?`:`Comment dit-on « ${V[i][0]} » en chinois ?`;
    const opts=shuffle([i,...others]);
    return {q,answers:opts.map(j=>toFr?V[j][0]:zh(V[j])),ok:opts.indexOf(i)};
  });
}
const hostId=new URLSearchParams(location.search).get("h");
if(typeof Peer==="undefined"){app.innerHTML='<h1>Connexion impossible</h1><p class="center">Le service de connexion n\'a pas pu se charger. Vérifie la connexion internet.</p>'}
else if(hostId) student(hostId); else teacher();

/* ================= PROF ================= */
function teacher(){
  const code=String(Math.floor(1000+Math.random()*9000));
  const peer=new Peer(PREFIX+code,PO);
  const players={}; // id -> {name,score,conn,ans}
  let quiz=buildQuiz(), qi=-1, phase="lobby", t0=0, tick=null;
  const send=(c,m)=>{try{c.open&&c.send(m)}catch(e){}};
  const all=m=>Object.values(players).forEach(p=>send(p.conn,m));
  const list=()=>Object.values(players);
  peer.on("error",e=>{if(e.type==="unavailable-id"){location.reload()}else console.warn(e)});
  peer.on("open",()=>render());
  peer.on("connection",conn=>{
    conn.on("data",m=>{
      if(m.t==="join"){
        const name=String(m.name||"").slice(0,20).trim()||"Anonyme";
        players[conn.peer]=players[conn.peer]||{name,score:0};
        Object.assign(players[conn.peer],{conn,name});
        send(conn,{t:"joined",name});
        if(phase==="question") sendQuestion(conn);
        render();
      } else if(m.t==="answer"&&phase==="question"){
        const p=players[conn.peer]; if(!p||p.ans!=null) return;
        p.ans=m.a; const dt=(Date.now()-t0)/1000;
        p.gain=(m.a===quiz[qi].ok)?Math.round(1000*(1-dt/(TIME*2))):0; p.score+=p.gain;
        render();
        if(list().filter(p=>p.conn.open).every(p=>p.ans!=null)) endQuestion();
      }
    });
    conn.on("close",()=>render());
  });
  function sendQuestion(c){send(c,{t:"q",n:qi+1,total:quiz.length,q:quiz[qi].q,answers:quiz[qi].answers,end:t0+TIME*1000})}
  function start(){qi=-1;list().forEach(p=>p.score=0);next()}
  function next(){
    qi++; if(qi>=quiz.length){phase="end";all({t:"end",rank:ranking()});return render()}
    phase="question"; t0=Date.now(); list().forEach(p=>{p.ans=null;p.gain=0});
    list().forEach(p=>sendQuestion(p.conn));
    clearInterval(tick); tick=setInterval(()=>{if(Date.now()-t0>=TIME*1000)endQuestion();else render()},250);
    render();
  }
  function endQuestion(){
    if(phase!=="question")return; clearInterval(tick); phase="reveal";
    const rk=ranking();
    list().forEach(p=>send(p.conn,{t:"reveal",correct:p.ans===quiz[qi].ok,gain:p.gain||0,score:p.score,good:quiz[qi].answers[quiz[qi].ok],pos:rk.findIndex(r=>r.name===p.name)+1}));
    render();
  }
  function ranking(){return list().map(p=>({name:p.name,score:p.score})).sort((a,b)=>b.score-a.score)}
  function render(){
    const url=location.origin+location.pathname+"?h="+code;
    const ps=list(), online=ps.filter(p=>p.conn&&p.conn.open);
    if(phase==="lobby"){
      app.innerHTML=`<h1>🇫🇷 Le monde du travail 🇨🇳</h1>
      <div class="card center"><p class="mut">Scanne le QR code avec ton téléphone</p>
      <div class="qr" id="qr"></div>
      <p style="font-size:22px">ou va sur <b>${esc(url)}</b></p>
      <p class="big">Code : ${code}</p>
      <p class="mut">${online.length} joueur(s) connecté(s)</p>
      <div class="players">${online.map(p=>`<span>${esc(p.name)}</span>`).join("")}</div>
      <p><button id="go" ${online.length?"":"disabled"}>▶ Lancer le quiz (${quiz.length} questions)</button></p></div>`;
      if(peer.id) new QRCode($("#qr"),{text:url,width:240,height:240});
      $("#go").onclick=start;
    } else if(phase==="question"){
      const q=quiz[qi], left=Math.max(0,Math.ceil(TIME-(Date.now()-t0)/1000)), n=online.filter(p=>p.ans!=null).length;
      app.innerHTML=`<div class="bar"><span class="mut">Question ${qi+1}/${quiz.length}</span><span class="mut">Réponses : ${n}/${online.length}</span></div>
      <div class="timer">${left}</div><div class="q">${esc(q.q)}</div>
      <div class="grid">${q.answers.map((a,i)=>`<div class="ans c${i}">${["▲","◆","●","■"][i]} &nbsp;${esc(a)}</div>`).join("")}</div>
      <p class="center"><button id="skip">Passer ⏭</button></p>`;
      $("#skip").onclick=endQuestion;
    } else if(phase==="reveal"){
      const q=quiz[qi], counts=[0,1,2,3].map(i=>online.filter(p=>p.ans===i).length);
      app.innerHTML=`<div class="bar"><span class="mut">Question ${qi+1}/${quiz.length}</span></div>
      <div class="q">${esc(q.q)}</div>
      <div class="grid">${q.answers.map((a,i)=>`<div class="ans c${i} ${i===q.ok?"":"dim"}">${i===q.ok?"✅ ":""}${esc(a)} &nbsp;(${counts[i]})</div>`).join("")}</div>
      <div class="card"><ol class="score">${ranking().slice(0,5).map((r,i)=>`<li><span>${i+1}. ${esc(r.name)}</span><b>${r.score}</b></li>`).join("")}</ol></div>
      <p class="center"><button id="nx">${qi+1<quiz.length?"Question suivante ➡":"Voir le podium 🏆"}</button></p>`;
      $("#nx").onclick=next;
    } else {
      const rk=ranking();
      app.innerHTML=`<h1>🏆 Podium</h1><div class="card"><ol class="score">${rk.map((r,i)=>`<li><span>${["🥇","🥈","🥉"][i]||i+1+"."} ${esc(r.name)}</span><b>${r.score}</b></li>`).join("")}</ol></div>
      <p class="center"><button id="again">🔁 Rejouer (questions mélangées)</button></p>`;
      $("#again").onclick=()=>{quiz=buildQuiz();start()};
    }
  }
  app.innerHTML='<h1>Connexion…</h1>';
}

/* ================= ÉLÈVE ================= */
function student(code){
  let peer=null, conn=null, name="", tick=null, answered=false;
  function askName(err){
    app.innerHTML=`<h1>🇫🇷 Quiz 🇨🇳</h1><div class="card center">
      ${err?`<p style="color:#ff8a8a">${esc(err)}</p>`:""}
      <p>Entre ton pseudo</p><input id="nm" maxlength="20" autocomplete="off" value="${esc(name)}"><p><button id="ok">Rejoindre</button></p></div>`;
    $("#nm").focus();
    const go=()=>{name=$("#nm").value.trim(); if(!name)return; connect()};
    $("#ok").onclick=go; $("#nm").onkeydown=e=>{if(e.key==="Enter")go()};
  }
  function connect(){
    app.innerHTML='<h1>Connexion…</h1>';
    peer=peer||new Peer(PREFIX+code+"-"+Math.random().toString(36).slice(2,10),PO);
    const doConn=()=>{
      conn=peer.connect(PREFIX+code,{reliable:true});
      const to=setTimeout(()=>{if(!conn.open)askName("Partie introuvable : vérifie le QR code ou demande au professeur.")},10000);
      conn.on("open",()=>{clearTimeout(to);conn.send({t:"join",name})});
      conn.on("data",onMsg);
      conn.on("close",()=>{app.innerHTML='<h1>Déconnecté</h1><p class="center"><button onclick="location.reload()">Se reconnecter</button></p>'});
    };
    peer.open?doConn():peer.on("open",doConn);
    peer.on("error",e=>askName("Erreur de connexion ("+e.type+")."));
  }
  function onMsg(m){
    clearInterval(tick);
    if(m.t==="joined"){app.innerHTML=`<h1>Bienvenue ${esc(m.name)} 👋</h1><div class="card center"><p class="big">✔</p><p>Tu es dans la partie. Regarde l'écran du professeur…</p></div>`}
    else if(m.t==="q"){
      answered=false;
      const draw=()=>{const left=Math.max(0,Math.ceil((m.end-Date.now())/1000));
        if(answered)return;
        app.innerHTML=`<div class="bar"><span class="mut">${m.n}/${m.total}</span><span class="timer" style="font-size:32px">${left}</span></div>
        <div class="q" style="font-size:22px">${esc(m.q)}</div>
        <div class="grid">${m.answers.map((a,i)=>`<button class="ans c${i}" data-i="${i}">${esc(a)}</button>`).join("")}</div>`;
        app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{answered=true;clearInterval(tick);conn.send({t:"answer",a:+b.dataset.i});
          app.innerHTML=`<div class="card center"><p class="big">⏳</p><p>Réponse envoyée ! On attend les autres…</p></div>`});
      };
      draw(); tick=setInterval(()=>{if(Date.now()>=m.end){clearInterval(tick);if(!answered)app.innerHTML='<div class="card center"><p class="big">⌛</p><p>Temps écoulé !</p></div>'}else draw()},1000);
    }
    else if(m.t==="reveal"){
      app.innerHTML=`<div class="card center" style="background:${m.correct?"var(--ok)":"var(--ko)"}">
        <p class="big">${m.correct?"✅ Bravo !":"❌ Raté"}</p>
        ${m.correct?`<p style="font-size:24px">+${m.gain} points</p>`:`<p>Bonne réponse : <b>${esc(m.good)}</b></p>`}
        <p>Score : <b>${m.score}</b> — ${m.pos}<sup>e</sup> place</p></div>`;
    }
    else if(m.t==="end"){
      const pos=m.rank.findIndex(r=>r.name===name)+1;
      app.innerHTML=`<h1>🏁 Fin du quiz</h1><div class="card center"><p class="big">${["🥇","🥈","🥉"][pos-1]||pos+"e"}</p><p>${esc(name)} : ${m.rank[pos-1]?m.rank[pos-1].score:0} points</p></div>`;
    }
  }
  askName();
}
</script>
</body>
</html>
