<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 10" width="100%" height="10" role="presentation">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14524c" stop-opacity="0.05" />
      <stop offset="25%" stop-color="#14524c" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f5b942" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#14524c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14524c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0" />
      <stop offset="50%" stop-color="#f5b942" stop-opacity="1" />
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="2" rx="1" fill="url(#barGrad)" />
  <rect x="0" y="3" width="160" height="4" rx="2" fill="url(#glowGrad)">
    <animate attributeName="x" values="-160;900;-160" dur="4.5s" repeatCount="indefinite" />
  </rect>
</svg>