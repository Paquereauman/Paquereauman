<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="100%" height="6" role="presentation">
  <defs>
    <!-- Degrade retro ambre vintage / bronze chaleureux -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181815" stop-opacity="0.05" />
      <stop offset="25%" stop-color="#d97706" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.80" />
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#181815" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="900" height="2" rx="1" fill="url(#barGrad)" />
  <rect x="0" y="1" width="160" height="4" rx="2" fill="url(#glowGrad)">
    <animate attributeName="x" values="-160;900;-160" dur="4.5s" repeatCount="indefinite" />
  </rect>
</svg>