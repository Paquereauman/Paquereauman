<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Paquereauman, anthropologist, teacher, I build useful tools with Claude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#14524c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#f58f42"/>
    </linearGradient>
    <clipPath id="r"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <!-- réseau de points : le scraping, les liens entre les choses -->
    <g stroke="#7fd1c4" stroke-opacity=".28" stroke-width="1.2" fill="none">
      <path d="M610 40L690 90L780 50L850 120L770 180L680 160L610 40"/>
      <path d="M690 90L680 160M780 50L770 180M690 90L770 180"/>
      <path d="M850 120L880 200M680 160L640 215"/>
    </g>
    <g fill="#7fd1c4">
      <circle cx="610" cy="40" r="5" opacity=".7"/>
      <circle cx="690" cy="90" r="7"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="50" r="5" opacity=".7"/>
      <circle cx="850" cy="120" r="8"><animate attributeName="opacity" values="1;.5;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="180" r="6" opacity=".8"/>
      <circle cx="680" cy="160" r="5" opacity=".7"/>
      <circle cx="880" cy="200" r="4" opacity=".5"/>
      <circle cx="640" cy="215" r="4" opacity=".5"/>
    </g>
    <circle cx="850" cy="120" r="14" fill="none" stroke="#f5b942" stroke-width="2" opacity=".9">
      <animate attributeName="r" values="12;22;12" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0;.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Paquereauman</text>
    <rect x="50" y="128" width="120" height="5" rx="2.5" fill="url(#line)"/>
    <text x="48" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cfe8e4">Anthropologist · Teacher</text>
    <text x="48" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cfe8e4">I build useful tools with Claude</text>
  </g>
</svg>
