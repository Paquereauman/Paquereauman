<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Bai Laoshi (Paquereauman), teacher, techno-anthropologist, building pragmatic tools with Claude">
  <defs>
    <!-- Style responsive optimise pour mobile et ecrans haute densite -->
    <style>
      .banner-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'IBM Plex Sans', Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 700; fill: #fffbeb; letter-spacing: -0.01em; }
      .banner-sub { font-family: 'IBM Plex Mono', 'Courier New', ui-monospace, monospace; font-size: 19px; font-weight: 500; fill: #d6cbbe; }
      .banner-anim { font-family: 'IBM Plex Mono', 'Courier New', ui-monospace, monospace; font-size: 19px; font-weight: 600; fill: #fbbf24; }
      @media (max-width: 600px) {
        .banner-title { font-size: 58px; }
        .banner-sub { font-size: 22px; font-weight: 600; }
        .banner-anim { font-size: 22px; font-weight: 700; }
        .retro-grid { opacity: 0.03; }
        .constellation { opacity: 0.18; }
      }
    </style>

    <!-- Fond retro : charbon vintage / CRT obsidienne chaud (pas de magma/volcan) -->
    <linearGradient id="retroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141412"/>
      <stop offset="50%" stop-color="#181815"/>
      <stop offset="100%" stop-color="#1d1b18"/>
    </linearGradient>

    <!-- Ambiance douce phosphore ambre vintage (tres subtile, 10% max) -->
    <radialGradient id="amberPhosphor" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#141412" stop-opacity="0"/>
    </radialGradient>

    <!-- Grille technique retro / wireframe CRT -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.06"/>
    </pattern>

    <clipPath id="roundedCorners">
      <rect width="900" height="240" rx="18"/>
    </clipPath>

    <!-- Trajectoires d'ecriture synchronisees sur un cycle maitre de 13 secondes -->
    <!-- Ligne 1 : @Paquereauman · Teacher (tape de 0 a 1.8s, RESTE AFFICHE jusqu'a 12.2s, efface pour boucler) -->
    <path id="pathLine1">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="m68,164 h0 ; m68,164 h330 ; m68,164 h330 ; m68,164 h0 ; m68,164 h0"
        keyTimes="0 ; 0.14 ; 0.94 ; 0.97 ; 1" />
    </path>

    <!-- Ligne 2 Phrase A : Techno-anthropologist turned teacher (tape de 2.2 a 4.4s, lit jusqu'a 6.4s, efface a 7.1s) -->
    <path id="pathLine2A">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="m68,198 h0 ; m68,198 h0 ; m68,198 h460 ; m68,198 h460 ; m68,198 h0 ; m68,198 h0"
        keyTimes="0 ; 0.17 ; 0.34 ; 0.49 ; 0.55 ; 1" />
    </path>

    <!-- Ligne 2 Phrase B : Building pragmatic tools with Claude (tape de 7.1 a 9.3s, lit jusqu'a 11.5s, efface a 12.2s) -->
    <path id="pathLine2B">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="m68,198 h0 ; m68,198 h0 ; m68,198 h470 ; m68,198 h470 ; m68,198 h0 ; m68,198 h0"
        keyTimes="0 ; 0.55 ; 0.72 ; 0.88 ; 0.94 ; 1" />
    </path>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <!-- Fond vintage chaleureux -->
    <rect width="900" height="240" fill="url(#retroBg)"/>
    <rect width="900" height="240" fill="url(#amberPhosphor)"/>
    <rect class="retro-grid" width="900" height="240" fill="url(#techGrid)"/>

    <!-- Bordure interne type chassis retro / moniteur CRT -->
    <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Reseau vectoriel constellation ambre retro (style blueprint / oscilloscope) -->
    <g class="constellation" stroke="#f59e0b" stroke-opacity=".32" stroke-width="1.4" fill="none">
      <path d="M620 45L695 95L785 55L850 120L775 180L685 160L620 45"/>
      <path d="M695 95L685 160M785 55L775 180M695 95L775 180"/>
      <path d="M850 120L875 195M685 160L645 210" stroke-dasharray="4 3"/>
    </g>

    <!-- Noeuds du reseau en phosphore ambre -->
    <g class="constellation" fill="#f59e0b">
      <circle cx="620" cy="45" r="4.5" opacity=".7"/>
      <circle cx="695" cy="95" r="6"><animate attributeName="opacity" values=".4;.95;.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="785" cy="55" r="4.5" opacity=".7"/>
      <circle cx="850" cy="120" r="7.5"><animate attributeName="opacity" values="1;.4;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="775" cy="180" r="5.5" opacity=".8"/>
      <circle cx="685" cy="160" r="4.5" opacity=".7"/>
      <circle cx="875" cy="195" r="3.5" opacity=".5"/>
      <circle cx="645" cy="210" r="3.5" opacity=".5"/>
    </g>

    <!-- Anneaux radar retro autour du noeud phare -->
    <circle cx="850" cy="120" r="16" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3" opacity=".75">
      <animate attributeName="r" values="10;26;10" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;0;.85" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="120" r="24" fill="none" stroke="#f59e0b" stroke-width="1" opacity=".4">
      <animate attributeName="r" values="16;36;16" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Titre Bai Laoshi (chaud et elegant) -->
    <text class="banner-title" x="48" y="100">Bai Laoshi</text>

    <!-- Triple bande retro 70s / 80s (Creme, Ambre, Terre cuite) -->
    <rect x="48" y="118" width="130" height="3" rx="1.5" fill="#fef08a"/>
    <rect x="48" y="123" width="95" height="3" rx="1.5" fill="#f59e0b"/>
    <rect x="48" y="128" width="60" height="3" rx="1.5" fill="#c2410c"/>

    <!-- LIGNE 1 : Prompt fixe et texte tape qui RESTE affiche -->
    <text x="48" y="164" font-family="'IBM Plex Mono', 'Courier New', ui-monospace, monospace" font-size="19" font-weight="700" fill="#f59e0b">&gt;</text>
    <text class="banner-sub">
      <textPath href="#pathLine1" xlink:href="#pathLine1">@Paquereauman &#183; Teacher</textPath>
    </text>

    <!-- LIGNE 2 : Prompt qui apparait quand la frappe saute a la ligne 2 -->
    <text x="48" y="198" font-family="'IBM Plex Mono', 'Courier New', ui-monospace, monospace" font-size="19" font-weight="700" fill="#f59e0b">
      <animate attributeName="opacity" dur="13s" repeatCount="indefinite"
        values="0 ; 0 ; 1 ; 1 ; 0 ; 0"
        keyTimes="0 ; 0.14 ; 0.15 ; 0.94 ; 0.97 ; 1" />
      &gt;
    </text>

    <!-- LIGNE 2 Phrase A : Techno-anthropologist turned teacher (tape, lit, puis efface) -->
    <text class="banner-anim">
      <textPath href="#pathLine2A" xlink:href="#pathLine2A">Techno-anthropologist turned teacher</textPath>
    </text>

    <!-- LIGNE 2 Phrase B : Building pragmatic tools with Claude (tape, lit, puis efface pour boucler) -->
    <text class="banner-anim">
      <textPath href="#pathLine2B" xlink:href="#pathLine2B">Building pragmatic tools with Claude</textPath>
    </text>

    <!-- CURSEUR BLOC RETRO UNIQUE : suit la frappe sur L1, saute sur L2, suit phrase A, efface, suit phrase B, efface, et reboucle -->
    <text font-family="'IBM Plex Mono', 'Courier New', ui-monospace, monospace" font-size="19" fill="#f59e0b">
      <animate attributeName="x" dur="13s" repeatCount="indefinite"
        values="68 ; 350 ; 68 ; 480 ; 480 ; 68 ; 490 ; 490 ; 68 ; 68 ; 68"
        keyTimes="0 ; 0.14 ; 0.17 ; 0.34 ; 0.49 ; 0.55 ; 0.72 ; 0.88 ; 0.94 ; 0.97 ; 1" />
      <animate attributeName="y" dur="13s" repeatCount="indefinite"
        values="164 ; 164 ; 198 ; 198 ; 198 ; 198 ; 198 ; 198 ; 198 ; 164 ; 164"
        keyTimes="0 ; 0.14 ; 0.17 ; 0.34 ; 0.49 ; 0.55 ; 0.72 ; 0.88 ; 0.94 ; 0.97 ; 1" />
      <tspan fill="#f59e0b"><animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite"/>&#9608;</tspan>
    </text>
  </g>
</svg>