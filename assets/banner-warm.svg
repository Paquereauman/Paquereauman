<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Bai Laoshi (Paquereauman), teacher, techno-anthropologist, building pragmatic tools with Claude">
  <defs>
    <!-- Style responsive optimise pour mobile et ecrans haute densite -->
    <style>
      .banner-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 58px; font-weight: 700; fill: #ffffff; letter-spacing: -0.02em; }
      .banner-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #ffd8be; }
      .banner-anim { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #ffb703; }
      @media (max-width: 600px) {
        .banner-title { font-size: 62px; }
        .banner-sub { font-size: 24px; font-weight: 600; }
        .banner-anim { font-size: 24px; font-weight: 700; }
        .constellation { opacity: 0.22; }
      }
    </style>

    <!-- Fond chaud : degrade d'ebene ambre vers cuivre chaleureux -->
    <linearGradient id="warmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180b05"/>
      <stop offset="45%" stop-color="#2d1307"/>
      <stop offset="100%" stop-color="#4a1c09"/>
    </linearGradient>

    <!-- Halo lumineux chaud orange-feu sous la constellation -->
    <radialGradient id="warmEmber" cx="78%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7900" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#180b05" stop-opacity="0"/>
    </radialGradient>

    <!-- Barre d'accentuation or et feu -->
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>

    <clipPath id="roundedCorners">
      <rect width="900" height="240" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <!-- Fond chaud -->
    <rect width="900" height="240" fill="url(#warmBg)"/>
    <rect width="900" height="240" fill="url(#warmEmber)"/>

    <!-- Reseau de points constellation en teintes or et ambre chaud -->
    <g class="constellation" stroke="#ffb703" stroke-opacity=".40" stroke-width="1.5" fill="none">
      <path d="M610 40L690 90L780 50L850 120L770 180L680 160L610 40"/>
      <path d="M690 90L680 160M780 50L770 180M690 90L770 180"/>
      <path d="M850 120L880 200M680 160L640 215"/>
    </g>

    <!-- Noeuds du reseau avec pulsation lumineuse -->
    <g class="constellation" fill="#ffb703">
      <circle cx="610" cy="40" r="5" opacity=".75"/>
      <circle cx="690" cy="90" r="7"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="50" r="5" opacity=".75"/>
      <circle cx="850" cy="120" r="9"><animate attributeName="opacity" values="1;.4;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="180" r="6" opacity=".85"/>
      <circle cx="680" cy="160" r="5" opacity=".75"/>
      <circle cx="880" cy="200" r="4" opacity=".55"/>
      <circle cx="640" cy="215" r="4" opacity=".55"/>
    </g>

    <!-- Anneaux dores pulsants sur le noeud phare -->
    <circle cx="850" cy="120" r="14" fill="none" stroke="#ffb703" stroke-width="2.4" opacity=".95">
      <animate attributeName="r" values="9;26;9" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="120" r="20" fill="none" stroke="#fb8500" stroke-width="1.4" opacity=".6">
      <animate attributeName="r" values="14;34;14" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Titre Bai Laoshi -->
    <text class="banner-title" x="48" y="104">Bai Laoshi</text>

    <!-- Barre d'accentuation en degrade chaud or / orange -->
    <rect x="50" y="122" width="130" height="5" rx="2.5" fill="url(#goldLine)"/>

    <!-- Sous-titre identite (chaud et doux) -->
    <text class="banner-sub" x="48" y="162">@Paquereauman &#183; Teacher</text>

    <!-- Message anime 1 : Building pragmatic tools with Claude -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.50;0.95;1" dur="8s" repeatCount="indefinite"/>
      <text class="banner-anim" x="48" y="198">
        Building pragmatic tools with Claude<tspan fill="#ff7900"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>_</tspan>
      </text>
    </g>

    <!-- Message anime 2 : Techno-anthropologist turned teacher -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.50;0.95;1" dur="8s" repeatCount="indefinite"/>
      <text class="banner-anim" x="48" y="198">
        Techno-anthropologist turned teacher<tspan fill="#ff7900"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>_</tspan>
      </text>
    </g>
  </g>
</svg>